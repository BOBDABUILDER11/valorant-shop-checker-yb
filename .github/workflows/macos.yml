name: Validate macOS companion
on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: python -m pip install -e 'backend[dev]' -e 'companion[dev]'
      - name: Python checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest backend/tests companion/tests -q
          python -m ruff check backend/app backend/tests companion
          python -m mypy backend/app
          bash -n scripts/setup_mac.sh scripts/run_mac.sh
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
